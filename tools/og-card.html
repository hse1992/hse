<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Карточка превью</title>
<!-- Карточка превью ссылки, 1200 на 630: уменьшенная обложка страницы.
     Это не часть страницы — ее снимают в assets/og-card-cover-2.jpg
     (tools/build-og-card.py), а страница ссылается на снимок только из
     метаданных в <head>. Браузер читателя ее не грузит.

     Собрана из обложки: тот же фон — фирменный рисунок и свечение, тот же
     заголовок со знаком Вышки вместо «о» и ударением, тот же подзаголовок
     под ним, по левому краю. Иллюстраций нет: карточка — обложка, а не
     история.

     Кегли подобраны под миниатюру: в мессенджере карточка бывает шириной
     около 320 пикселей, вчетверо меньше, и подзаголовок в 62px там — 16px,
     читаемый текст. Поля: все важное не ближе 72px к краю — мессенджеры
     скругляют углы и иногда подрезают карточку. -->
<link rel="stylesheet" href="../styles/fonts.css" />
<link rel="stylesheet" href="../styles/tokens.css" />
<style>
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'HSE Sans', -apple-system, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--text);
  }

  /* Фон страницы как есть: рисунок в своих пропорциях (560 на 480), под
     вуалью --bg-veil — так же, как на сайте (styles/layout.css, body). */
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background:
      linear-gradient(var(--bg-veil), var(--bg-veil)),
      var(--bg) url('../assets/hse-sign-pattern.svg') repeat;
    background-size: auto, 560px 480px;
  }

  /* Под текстом рисунок тише, как под подзаголовком обложки (--bg-hush), —
     мягко и без края: к свободным краям карточки он остается таким же, как
     на сайте. */
  .hush {
    position: absolute;
    left: 0;
    top: 40px;
    width: 1110px;
    height: 560px;
    background: radial-gradient(closest-side, var(--bg-hush) 62%, transparent);
  }

  /* Свечение обложки (.page-header::before). */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(110% 85% at 16% 24%, var(--header-glow), transparent 62%),
      radial-gradient(85% 70% at 88% 62%, var(--header-glow-soft), transparent 66%);
  }

  .text {
    position: absolute;
    left: 80px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 34px;
  }

  /* Заголовок обложки: 700, межбуквенный −0,04em, интерлиньяж 0,98. */
  .title {
    margin: 0;
    font-size: 184px;
    font-weight: 700;
    line-height: 0.98;
    letter-spacing: -0.04em;
  }
  .title .line { display: block; }

  /* Знак вместо «о» и ударение — как на обложке (styles/layout.css). */
  .hse-o {
    width: 0.479em;
    height: 0.479em;
    margin: 0 0.031em;
    vertical-align: -0.014em;
  }
  .hse-o-disc { fill: var(--hse-blue); }
  .hse-o-mark { fill: #FFFFFF; }
  .stressed { position: relative; display: inline-block; line-height: 1; }
  .stressed i {
    position: absolute;
    left: 50%;
    bottom: 0.62em;
    width: 0.075em;
    height: 0.2em;
    border-radius: 0.04em;
    background: currentColor;
    transform: translateX(-50%) rotate(20deg);
  }

  /* Подзаголовок обложки: обычное начертание, цвет --text-lead. */
  .sub {
    margin: 0;
    font-size: 62px;
    font-weight: 400;
    line-height: 1.2;
    color: var(--text-lead);
  }
</style>
</head>
<body>
<div class="card">
  <div class="hush"></div>
  <div class="text">
    <h1 class="title">
      <span class="line">На сколько</span>
      <span class="line">б<svg class="hse-o" viewBox="0 0 283.47 283.47" aria-hidden="true"><circle class="hse-o-disc" cx="141.73" cy="141.74" r="141.73"/><path class="hse-o-mark" d="M135.6,133.32c32.26,0,44.81,21.45,44.81,60.69v29.51h-20.69v-63.35h-23.9v63.42h-18.28V53.65h18.78c7.03,0,17.71,1.58,25.25,10.95c3.93,4.73,6.34,11.04,7.19,17.38h-32.94v9.35h33.23c-0.27,6.04-1.49,12.8-7.42,19.97c-5.2,6.51-13.76,12.56-25.83,12.56c-0.06,0-0.13,0-0.2,0V133.32 M206.41,197.55c0-34.86-11.26-58.29-40.45-68.6c9.21-3.77,14.82-9.58,18.49-13.99c7.01-8.06,9.88-17.96,9.88-27.31c0-7.56-2.08-22.65-15.35-33.04c-9.1-7.04-17.16-10.43-36.43-10.43h-9.75c-0.3-0.01-0.6-0.01-0.96-0.01H91.65v189.79h114.76V197.55z"/></svg>льш<span class="stressed">а<i></i></span>я</span>
    </h1>
    <p class="sub">Пробуем измерить масштабы Вышки</p>
  </div>
</div>
</body>
</html>
