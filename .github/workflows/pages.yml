# Публикация страницы на GitHub Pages.
#
# Публикуется не ветка как есть, а ее сборка: tools/build-site.py убирает из
# кода страницы комментарии и отступы — до кнопки «Начать историю» телефон
# скачивает вдвое меньше. Исходники в ветке остаются читаемыми.
#
# Работает после одного переключения в настройках репозитория:
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# Пока там стоит «Deploy from a branch», сайт по-прежнему отдает ветку как
# есть, и этот файл ничего не ломает.

name: Публикация

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка
        run: python3 tools/build-site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
