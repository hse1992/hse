<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тизер «На сколько большая»</title>
<link rel="stylesheet" href="../styles/fonts.css">
<link rel="stylesheet" href="../styles/tokens.css">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'HSE Sans', system-ui, sans-serif;
    display: flex;
    gap: 32px;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
  }
  canvas {
    height: calc(100vh - 32px);
    max-width: 100%;
    aspect-ratio: 9 / 16;
    background: var(--card);
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(20, 23, 28, 0.12);
  }
  .panel { width: 280px; display: flex; flex-direction: column; gap: 12px; }
  .panel h1 { margin: 0; font-size: 28px; line-height: 1.1; }
  .panel p { margin: 0; color: var(--text-secondary); line-height: 1.4; }
  .panel button {
    font: 600 16px 'HSE Sans', system-ui, sans-serif;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid var(--btn-border);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    transition: border-color 140ms ease;
  }
  .panel button:hover { border-color: var(--btn-border-hover); }
  .panel button[data-el="record"] { background: var(--hse-blue); color: var(--card); border-color: var(--hse-blue); }
  .panel button:disabled { opacity: 0.5; cursor: default; }
  .panel input { width: 100%; }
  .panel a { color: var(--link); }
  @media (max-width: 860px) {
    body { flex-direction: column; height: auto; }
    canvas { height: auto; width: 100%; }
    .panel { width: 100%; }
  }
</style>
</head>
<body>
<canvas width="1080" height="1920"></canvas>
<aside class="panel">
  <h1>Тизер на 30 секунд</h1>
  <p>Вертикальное видео 1080×1920 со звуком. Цифры и цвета берутся из данных страницы.</p>
  <button data-el="play">Смотреть со звуком</button>
  <button data-el="record">Собрать видео</button>
  <input data-el="scrub" type="range" min="0" max="30" step="0.01" value="0" aria-label="Кадр">
  <p data-el="time">0,00 с</p>
  <p data-el="status">Видео собирается по кадрам, примерно за минуту, и сохраняется в teaser/teaser.mp4.</p>
</aside>

<script type="module">
import { CITIES, LYCEUM, LYCEUM_COLOR, HSE_TOTAL, FOREIGN, ADMITTED } from '../data/hse.js';

// ---------- constants ----------

const W = 1080, H = 1920, DUR = 30;
const CX = 540, CY = 1080;
const TAU = Math.PI * 2;
const ARENA = 81000;                 // seats in «Лужники»

const css = getComputedStyle(document.documentElement);
function tok(name) {
  const v = css.getPropertyValue('--' + name).trim();
  const m = v.match(/^var\(--([\w-]+)\)$/);
  return m ? tok(m[1]) : v;
}
const INK = tok('text'), CARD = tok('card'), SHELL = tok('shell'), EMPTY = tok('empty');
const SECOND = tok('text-secondary'), HSE = tok('hse-blue'), PITCH = tok('pitch');
const STUD = tok('students'), FOR = tok('foreign');
const CYAN = tok('brand-cyan'), RED = tok('brand-red'), GREEN = tok('brand-green');
const YELLOW = tok('brand-yellow'), ORANGE = tok('brand-orange'), NAVY = tok('brand-navy');
const BLUE = tok('brand-blue');

// ---------- math ----------

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const out3 = (p) => 1 - Math.pow(1 - p, 3);
const inOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);

// ---------- timing: the story runs 15 s, the video 30 s ----------

// Motion keeps its pace; the story slows down where there is text to read.
// Pairs of [video second, story second], joined by a monotone cubic so the
// pace changes without a jerk.
const STORY = 15;
const KEYS = [
  [0, 0], [1.4, 1.4], [3.0, 1.55], [3.45, 2.0],                     // doors
  [4.15, 2.7], [7.05, 3.85], [7.55, 4.3],                           // train
  [8.35, 5.0], [9.85, 6.3], [12.55, 6.9], [13.05, 7.45],            // arena
  [14.25, 8.6], [18.05, 9.7], [18.35, 9.9],                         // flags
  [19.45, 10.95], [22.15, 11.12], [22.5, 11.3],                     // town
  [23.2, 11.95], [25.6, 12.35], [25.9, 12.55],                      // centuries
  [26.5, 12.67], [28.7, 13.8], [30, 15]                             // title
];
const KX = KEYS.map((k) => k[0]), KY = KEYS.map((k) => k[1]);
const KT = (() => {
  const n = KX.length, d = [], c = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((KY[i + 1] - KY[i]) / (KX[i + 1] - KX[i]));
  c[0] = d[0]; c[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) {
    const h0 = KX[i] - KX[i - 1], h1 = KX[i + 1] - KX[i];
    c[i] = d[i - 1] * d[i] <= 0 ? 0 : (3 * (h0 + h1)) / ((2 * h1 + h0) / d[i - 1] + (h1 + 2 * h0) / d[i]);
  }
  return c;
})();

function storyAt(x) {
  if (x <= 0) return 0;
  if (x >= KX[KX.length - 1]) return STORY;
  let i = 0;
  while (x > KX[i + 1]) i++;
  const h = KX[i + 1] - KX[i], s = (x - KX[i]) / h, s2 = s * s, s3 = s2 * s;
  return (2 * s3 - 3 * s2 + 1) * KY[i] + (s3 - 2 * s2 + s) * h * KT[i]
    + (-2 * s3 + 3 * s2) * KY[i + 1] + (s3 - s2) * h * KT[i + 1];
}

function realAt(y) {
  let lo = 0, hi = DUR;
  for (let k = 0; k < 40; k++) { const mid = (lo + hi) / 2; if (storyAt(mid) < y) lo = mid; else hi = mid; }
  return (lo + hi) / 2;
}

function hash01(n) {
  n |= 0;
  n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
  n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
  n ^= n >>> 16;
  return (n >>> 0) / 4294967296;
}
function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const hashStr = (s) => { let h = 7; for (const ch of s) h = Math.imul(h, 31) + ch.charCodeAt(0) | 0; return h; };

const rgbOf = (c) => { const n = parseInt(c.slice(1, 7), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const mix = (a, b, p) => {
  const x = rgbOf(a), y = rgbOf(b);
  return `rgb(${Math.round(lerp(x[0], y[0], p))},${Math.round(lerp(x[1], y[1], p))},${Math.round(lerp(x[2], y[2], p))})`;
};

// ---------- canvas and the hand-drawn pen ----------

const canvas = document.querySelector('canvas');
const g = canvas.getContext('2d');

let T = 0;          // story time, seconds (0..15)
let RT = 0;         // video time, seconds (0..30)
let RATE = 1;       // story seconds per video second at this moment
let BOIL = 0;       // lines re-jitter 8 times a second, like hand-drawn animation
let V = (p) => p;   // world -> screen for the scene being drawn
const M = (pts) => pts.map(V);
const jit = (k) => hash01(k * 7919 + BOIL * 104729) * 2 - 1;

// Paper grain, drawn once.
const grain = document.createElement('canvas');
grain.width = W; grain.height = H;
{
  const gg = grain.getContext('2d');
  const R = mulberry32(7);
  gg.fillStyle = INK;
  for (let i = 0; i < 26000; i++) {
    gg.globalAlpha = 0.015 + R() * 0.035;
    gg.fillRect(R() * W, R() * H, 1 + R() * 2, 1 + R() * 2);
  }
}

function cut(P, p) {
  let L = 0; const d = [0];
  for (let i = 1; i < P.length; i++) { L += Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); d.push(L); }
  const target = L * p, out = [P[0]];
  for (let i = 1; i < P.length; i++) {
    if (d[i] <= target) { out.push(P[i]); continue; }
    const f = (target - d[i - 1]) / (d[i] - d[i - 1] || 1);
    out.push([lerp(P[i - 1][0], P[i][0], f), lerp(P[i - 1][1], P[i][1], f)]);
    break;
  }
  return out;
}

function trace(P, closed, pass, amp, seed) {
  const src = new Array(P.length);
  for (let i = 0; i < P.length; i++) {
    const k = seed * 1013 + i * 7 + pass * 50021;
    src[i] = [P[i][0] + jit(k) * amp, P[i][1] + jit(k + 3) * amp];
  }
  // Long edges are split after the jitter, so the smoothing below rounds a
  // corner only slightly instead of turning a box into an oval.
  const q = [];
  const edges = closed ? src.length : src.length - 1;
  for (let i = 0; i < edges; i++) {
    const a = src[i], b = src[(i + 1) % src.length];
    const m = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 12));
    for (let s = 0; s < m; s++) q.push([lerp(a[0], b[0], s / m), lerp(a[1], b[1], s / m)]);
  }
  if (!closed) q.push(src[src.length - 1]);
  const n = q.length;
  g.beginPath();
  if (closed) {
    const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const s = mid(q[n - 1], q[0]);
    g.moveTo(s[0], s[1]);
    for (let i = 0; i < n; i++) { const e = mid(q[i], q[(i + 1) % n]); g.quadraticCurveTo(q[i][0], q[i][1], e[0], e[1]); }
    g.closePath();
  } else {
    g.moveTo(q[0][0], q[0][1]);
    for (let i = 1; i < n - 1; i++) {
      g.quadraticCurveTo(q[i][0], q[i][1], (q[i][0] + q[i + 1][0]) / 2, (q[i][1] + q[i + 1][1]) / 2);
    }
    g.lineTo(q[n - 1][0], q[n - 1][1]);
  }
}

function pen(pts, o = {}) {
  const { color = INK, width = 5, closed = false, progress = 1, amp = 2, seed = 1,
    alpha = 1, fill = null, fillAlpha = 1, passes = 2, stroke = true } = o;
  if (alpha <= 0.002 || progress <= 0 || pts.length < 2) return;
  g.save();
  g.lineCap = 'round'; g.lineJoin = 'round';
  if (fill) {
    trace(pts, true, 0, amp, seed);
    g.globalAlpha = alpha * fillAlpha * clamp(progress * 2 - 1);
    g.fillStyle = fill;
    g.fill();
  }
  if (stroke) {
    const full = progress >= 1;
    let P = closed && !full ? pts.concat([pts[0]]) : pts;
    if (!full) P = cut(P, progress);
    const loop = closed && full;
    g.strokeStyle = color;
    trace(P, loop, 0, amp, seed);
    g.globalAlpha = alpha; g.lineWidth = width; g.stroke();
    if (passes > 1) {
      trace(P, loop, 1, amp * 1.4, seed);
      g.globalAlpha = alpha * 0.35; g.lineWidth = width * 0.55; g.stroke();
    }
  }
  g.restore();
}

function disc(x, y, r, color, a = 1) {
  if (a <= 0 || r <= 0) return;
  g.globalAlpha = a;
  g.fillStyle = color;
  g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  g.globalAlpha = 1;
}

// ---------- shapes, in world units ----------

function line(x1, y1, x2, y2, step = 28) {
  const n = Math.max(1, Math.ceil(Math.hypot(x2 - x1, y2 - y1) / step)), pts = [];
  for (let i = 0; i <= n; i++) pts.push([lerp(x1, x2, i / n), lerp(y1, y2, i / n)]);
  return pts;
}

function rrect(x, y, w, h, r = 0, step = 28) {
  const pts = [];
  r = Math.min(r, w / 2, h / 2);
  const edge = (x1, y1, x2, y2) => {
    const n = Math.max(1, Math.ceil(Math.hypot(x2 - x1, y2 - y1) / step));
    for (let i = 0; i < n; i++) pts.push([lerp(x1, x2, i / n), lerp(y1, y2, i / n)]);
  };
  const arc = (cx, cy, a0) => {
    if (r <= 0) return;
    for (let i = 0; i < 5; i++) { const a = a0 + (i / 5) * Math.PI / 2; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  };
  edge(x + r, y, x + w - r, y); arc(x + w - r, y + r, -Math.PI / 2);
  edge(x + w, y + r, x + w, y + h - r); arc(x + w - r, y + h - r, 0);
  edge(x + w - r, y + h, x + r, y + h); arc(x + r, y + h - r, Math.PI / 2);
  edge(x, y + h - r, x, y + r); arc(x + r, y + r, Math.PI);
  return pts;
}

function ell(cx, cy, rx, ry, n = 48, a0 = -Math.PI / 2, a1 = null) {
  const full = a1 === null, span = full ? TAU : a1 - a0, m = full ? n : n + 1, pts = [];
  for (let i = 0; i < m; i++) { const a = a0 + span * i / n; pts.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); }
  return pts;
}

// ---------- text ----------

function fontOf(size, weight) { return `${weight} ${size}px "HSE Sans", system-ui, sans-serif`; }

function say(str, y, o = {}) {
  const { size = 80, weight = 700, color = INK, t0 = 0, t1 = 99, marker = null, x = CX, max = 960 } = o;
  const pin = out3(seg(T, t0, t0 + 0.45));
  const pout = inOut(seg(T, t1, t1 + 0.3));
  const a = pin * (1 - pout);
  if (a <= 0.002) return;
  g.save();
  let sz = size;
  const setFont = () => { g.font = fontOf(sz, weight); g.letterSpacing = `${-0.01 * sz}px`; };
  setFont();
  let w = g.measureText(str).width;
  if (w > max) { sz *= max / w; setFont(); w = g.measureText(str).width; }
  const dy = (1 - pin) * 0.26 * sz - pout * 0.18 * sz;
  const k = hashStr(str);
  g.globalAlpha = a;
  if (marker) {
    const padX = 0.26 * sz, top = y - 0.8 * sz + dy, bot = y + 0.26 * sz + dy;
    const wipe = out3(seg(T, t0, t0 + 0.38));
    const x0 = x - w / 2 - padX, x1 = x0 + (w + 2 * padX) * wipe;
    const q = [[x0 + jit(k) * 3, top + jit(k + 1) * 3], [x1 + jit(k + 2) * 3, top + jit(k + 3) * 3],
      [x1 + jit(k + 4) * 3, bot + jit(k + 5) * 3], [x0 + jit(k + 6) * 3, bot + jit(k + 7) * 3]];
    g.fillStyle = marker;
    g.beginPath(); q.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.closePath(); g.fill();
  }
  g.fillStyle = marker ? CARD : color;
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.fillText(str, x + jit(k + 9) * 0.8, y + dy + jit(k + 10) * 0.8);
  g.restore();
}

// Not a single figure is spelled out: every answer waits on the page.
const TEXTS = [
  ['Следующая остановка', 330, { size: 60, weight: 600, t0: 0.1, t1: 1.6 }],
  ['Осторожно, двери закрываются!', 1790, { size: 66, t0: 0.25, t1: 1.7 }],
  ['Сколько поездов нужно,', 470, { size: 84, t0: 2.0, t1: 4.2 }],
  ['чтобы увезти', 580, { size: 84, t0: 2.12, t1: 4.2 }],
  ['всех первокурсников?', 695, { size: 84, t0: 2.24, t1: 4.2, marker: HSE }],
  ['На сколько Вышка', 1560, { size: 84, t0: 5.2, t1: 6.95 }],
  ['заполнит «Лужники»?', 1670, { size: 84, t0: 5.35, t1: 6.95, marker: HSE }],
  ['Среди них есть иностранцы', 330, { size: 76, t0: 7.15, t1: 9.75, marker: FOR }],
  ['Как думаешь,', 465, { size: 84, t0: 7.6, t1: 9.75, marker: HSE }],
  ['из скольких стран?', 580, { size: 84, t0: 7.75, t1: 9.75, marker: HSE }],
  ['Сколько нужно зданий,', 430, { size: 84, t0: 9.95, t1: 11.2 }],
  ['чтобы получился город?', 545, { size: 84, t0: 10.08, t1: 11.2, marker: HSE }],
  ['Когда нужно поступить,', 430, { size: 84, t0: 11.3, t1: 12.42 }],
  ['чтобы пройти', 540, { size: 84, t0: 11.4, t1: 12.42 }],
  ['все программы?', 655, { size: 84, t0: 11.5, t1: 12.42, marker: HSE }],
  ['Угадай. Проверь.', 1340, { size: 92, t0: 13.35, marker: HSE }],
  ['Ссылка в описании', 1460, { size: 56, weight: 600, color: SECOND, t0: 13.55 }]
];

// ---------- scene 1-2: the doors and the endless train ----------

const PITCH_CAR = 1040, RING_CARS = 10, S_FAR = 0.23;
const RING_L = RING_CARS * PITCH_CAR * S_FAR, XL = CX - RING_L / 2;
const RXW = 390, RYW = 290;
let SHIFT = 0;

const pickCity = (r) => {
  let x = r * ADMITTED;
  for (const c of CITIES) { if ((x -= c.admitted) < 0) return c; }
  return CITIES[0];
};

// Accelerates, cruises, stops — and never shows its tail.
function shiftAt(t) {
  const v = 2200;
  if (t < 1.9) return 0;
  if (t < 3.0) return 0.5 * (v / 1.1) * (t - 1.9) ** 2;
  if (t < 3.8) return 1210 + v * (t - 3.0);
  if (t < 4.3) { const d = t - 3.8; return 2970 + v * d - 0.5 * (v / 0.5) * d * d; }
  return 3520;
}

// The straight train bends into an ever tighter arc until it closes into the
// ring of the arena: the line keeps its length, only its curvature grows.
const R_RING = RING_L / TAU;
function warp(p, e) {
  if (e < 1e-4) return p;
  const rb = RING_L / (e * TAU);
  const top = lerp(CY, CY - R_RING, e);
  const phi = (p[0] - CX) / rb;
  const d = (p[1] - CY) * lerp(1, 0.85, e);
  const x = CX + (rb - d) * Math.sin(phi) * lerp(1, RXW / R_RING, e);
  const y = top + rb - (rb - d) * Math.cos(phi);
  return [x, CY + (y - CY) * lerp(1, RYW / RXW, e)];
}

function person(x, key, a, lw, bottom = 500) {
  if (a <= 0.002) return;
  const col = pickCity(hash01(key * 7 + 3)).color;
  const o = { closed: true, fill: col, width: lw * 0.6, alpha: a, amp: lw * 0.3, passes: 1 };
  pen(M(ell(x, bottom, 44, 32, 10, Math.PI, TAU)), { ...o, seed: key * 3 + 11 });
  pen(M(ell(x, bottom - 62, 28, 28, 12)), { ...o, seed: key * 3 + 12 });
}

function crowd(ox, gap, lw) {
  const a = V([ox + 500 - gap / 2, 150]), b = V([ox + 500 + gap / 2, 900]);
  g.save();
  g.beginPath(); g.rect(a[0], a[1], b[0] - a[0], b[1] - a[1]); g.clip();
  [[ox + 510, 430, CITIES[2].color], [ox + 395, 470, CITIES[0].color], [ox + 625, 480, CITIES[1].color]].forEach(([x, y, col], i) => {
    const o = { closed: true, fill: col, width: lw, amp: 2 };
    pen(M(rrect(x - 92, y + 72, 184, 460, 80)), { ...o, seed: 700 + i });
    pen(M(ell(x, y, 60, 60, 20)), { ...o, seed: 710 + i });
  });
  g.restore();
}

function drawCar(ox, k, gap, lw, a) {
  const sd = (k + 50) * 97;
  const o = (extra) => ({ width: lw, alpha: a, amp: lw * 0.4, ...extra });
  pen(M(rrect(ox, 0, 1000, 900, 70)), o({ closed: true, fill: BLUE, seed: sd }));
  pen(M(line(ox + 40, 110, ox + 960, 110)), o({ seed: sd + 1, width: lw * 0.7, color: CARD, alpha: a * 0.6 }));
  [[50, 95, 175], [780, 825, 905]].forEach(([wx, h1, h2], i) => {
    pen(M(rrect(ox + wx, 190, 170, 310, 26)), o({ closed: true, fill: CARD, seed: sd + 2 + i }));
    person(ox + h1, k * 10 + i * 2, a, lw);
    person(ox + h2, k * 10 + i * 2 + 1, a, lw);
  });
  pen(M(rrect(ox + 260, 150, 480, 750, 10)), o({ closed: true, fill: CARD, seed: sd + 5 }));
  if (k === 0 && gap > 2) crowd(ox, gap, lw);
  const leaf = (x0, x1, side) => {
    const vx0 = Math.max(x0, ox + 260), vx1 = Math.min(x1, ox + 740);
    if (vx1 - vx0 < 3) return;
    pen(M(rrect(vx0, 150, vx1 - vx0, 750, 0)), o({ closed: true, fill: HSE, seed: sd + 6 + side }));
    const wx0 = Math.max(x0 + 45, vx0), wx1 = Math.min(x0 + 195, vx1);
    if (wx1 - wx0 > 3) pen(M(rrect(wx0, 210, wx1 - wx0, 300, 18)), o({ closed: true, fill: CARD, seed: sd + 8 + side }));
    if (gap < 1) person(x0 + 120, k * 10 + 7 + side, a * (k === 0 ? seg(T, 1.25, 1.5) : 1), lw, 510);
  };
  leaf(ox + 500 - gap / 2 - 240, ox + 500 - gap / 2, 0);
  leaf(ox + 500 + gap / 2, ox + 500 + gap / 2 + 240, 1);
  if (gap < 1) pen(M(line(ox + 500, 150, ox + 500, 900)), o({ seed: sd + 10 }));
  [150, 290, 710, 850].forEach((wx, i) => {
    pen(M(ell(ox + wx, 950, 48, 48, 18)), o({ closed: true, fill: CARD, seed: sd + 20 + i }));
    const ang = -SHIFT / 48 + i;
    pen(M([[ox + wx, 950], [ox + wx + Math.cos(ang) * 40, 950 + Math.sin(ang) * 40]]), o({ seed: sd + 30 + i, width: lw * 0.7, passes: 1 }));
  });
  pen(M(line(ox + 1000, 780, ox + 1040, 780, 20)), o({ seed: sd + 40 }));
}

function trainScene(t) {
  const a = 1 - seg(t, 4.95, 5.3);
  if (a <= 0) return;
  const z = inOut(seg(t, 1.6, 2.5));
  const s = lerp(1, S_FAR, z);
  SHIFT = shiftAt(t);
  const camera = (p) => [(p[0] - 500) * s + CX, (p[1] - 450) * s + CY];
  const bend = inOut(seg(t, 4.3, 5.0));
  V = bend > 0 ? (p) => warp(camera(p), bend) : camera;
  const lw = lerp(2.6, 6, clamp((s - S_FAR) / (1 - S_FAR)));
  const gap = 480 * (1 - inOut(seg(t, 0.45, 1.25)));

  const wx0 = (XL - CX) / s + 500, wx1 = (XL + RING_L - CX) / s + 500;
  pen(M(line(wx0, 1004, wx1, 1004, 40)), { width: lw * 0.8, seed: 7, alpha: a, amp: lw * 0.4 });

  // Only the cars whose centre falls inside one ring length: the ring closes on itself.
  const kMin = Math.ceil(((XL - CX) / s + SHIFT) / PITCH_CAR);
  const kMax = Math.ceil(((XL + RING_L - CX) / s + SHIFT) / PITCH_CAR) - 1;
  for (let k = kMin; k <= kMax; k++) drawCar(k * PITCH_CAR - SHIFT, k, k === 0 ? gap : 0, lw, a);
  V = (p) => p;
}

// The station board of the page itself, the one in the heading of the metro block.
const TABLO = new Image();
TABLO.src = '../assets/tablo-vyshkinskaya.svg';

function tablo(t) {
  const p = out3(seg(t, 0.1, 0.55)), q = inOut(seg(t, 1.6, 1.9));
  const a = p * (1 - q);
  if (a <= 0 || !TABLO.complete) return;
  const w = 900, h = (w * 198) / 1108;

// ---------- scene 3: «Лужники» ----------

const RX = 430, RY = 320, ROWS = 14;
const SEATS = [];
{
  for (let r = 0; r < ROWS; r++) {
    const f = lerp(0.56, 0.97, r / (ROWS - 1));
    const a = RX * f, b = RY * f;
    const per = Math.PI * (3 * (a + b) - Math.sqrt((3 * a + b) * (a + 3 * b)));
    const n = Math.floor(per / 17.5);
    for (let i = 0; i < n; i++) {
      const th = -Math.PI / 2 + ((i + (r % 2) * 0.5) / n) * TAU;
      SEATS.push({ r, x: CX + a * Math.cos(th), y: CY + b * Math.sin(th), u: (((th + Math.PI / 2) % TAU) + TAU) % TAU / TAU, gi: -1 });
    }
  }
  SEATS.sort((p, q) => p.u - q.u);
  const groups = [...CITIES.map((c) => ({ n: c.students + c.staff, staff: c.staff, color: c.color, light: c.colorLight })),
    { n: LYCEUM, staff: 0, color: LYCEUM_COLOR, light: LYCEUM_COLOR }];
  const N = SEATS.length;
  let acc = 0;
  groups.forEach((gr, gi) => {
    const from = Math.round((acc / ARENA) * N); acc += gr.n;
    const to = Math.round((acc / ARENA) * N);
    const part = SEATS.slice(from, to);
    const staffN = Math.round(part.length * gr.staff / gr.n);
    [...part].sort((p, q) => q.r - p.r).forEach((s, i) => {
      s.color = i < staffN ? gr.light : gr.color;
      s.student = i >= staffN && gi < CITIES.length;
    });
    part.forEach((s, i) => { s.gi = gi; s.delay = 5.0 + gi * 0.24 + (i / part.length) * 0.3; });
  });
  const R = mulberry32(11);
  const students = SEATS.filter((s) => s.student);
  const filled = SEATS.filter((s) => s.gi >= 0).length;
  const count = Math.round(filled * FOREIGN / HSE_TOTAL);
  for (let i = students.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [students[i], students[j]] = [students[j], students[i]]; }
  students.slice(0, count).forEach((s) => { s.foreign = true; });
}

function scarf(t) {
  const p = out3(seg(t, 5.45, 6.0)), q = seg(t, 6.95, 7.25);
  const a = p * (1 - q);
  if (a <= 0) return;
  const lt = t - 5.45;
  const sag = (x) => (1 - (x / 320) ** 2) * 24;
  const wave = (x) => Math.sin((x / 640) * TAU + t * 2.2) * 9;
  const yT = (x) => -44 + sag(x) + wave(x), yB = (x) => 44 + sag(x) + wave(x);
  g.save();
  g.translate(CX, 590 - (1 - p) * 90);
  g.rotate(Math.sin(lt * 8) * 0.14 * Math.exp(-lt * 3.2));
  const top = [], bot = [];
  for (let i = 0; i <= 24; i++) { const x = -320 + (i * 640) / 24; top.push([x, yT(x)]); bot.push([x, yB(x)]); }
  pen(top.concat(bot.reverse()), { closed: true, fill: HSE, width: 5, seed: 401, alpha: a });
  [-262, -232, 232, 262].forEach((sx, i) => {
    pen([[sx - 8, yT(sx) + 4], [sx + 8, yT(sx) + 4], [sx + 8, yB(sx) - 4], [sx - 8, yB(sx) - 4]],
      { closed: true, fill: CARD, stroke: false, seed: 410 + i, alpha: a });
  });
  [-1, 1].forEach((side) => {
    for (let i = 0; i < 6; i++) {
      const x = side * 320, y = lerp(yT(x) + 8, yB(x) - 8, i / 5);
      pen([[x, y], [x + side * 26, y + 4 + Math.sin(t * 5 + i) * 3]], { width: 3, seed: 420 + i + side * 10, alpha: a, passes: 1 });
    }
  });
  g.globalAlpha = a;
  g.font = fontOf(58, 700); g.letterSpacing = '4px';
  g.fillStyle = CARD; g.textAlign = 'center';
  g.fillText('ВЫШКА', 0, 20 + sag(0) + wave(0));
  g.restore();
}

function stadiumScene(t) {
  const a0 = seg(t, 4.85, 5.2);
  const k = inOut(seg(t, 7.5, 8.2));
  const a = a0 * (1 - k);
  const sc = 1 - 0.25 * k;
  const P = (x, y) => [CX + (x - CX) * sc, CY + (y - CY) * sc];
  if (a > 0) {
    V = (p) => P(p[0], p[1]);
    const pr = seg(t, 4.9, 5.6);
    pen(M(ell(CX, CY, RX + 26, RY + 26, 90)), { closed: true, width: 5, progress: pr, seed: 301, alpha: a });
    pen(M(ell(CX, CY, RX * 0.5, RY * 0.5, 60)), { closed: true, width: 4, progress: pr, seed: 302, alpha: a });
    pen(M(rrect(CX - 150, CY - 95, 300, 190, 14)), { closed: true, fill: PITCH, fillAlpha: 0.45, width: 4, progress: pr, seed: 303, alpha: a });
    pen(M(line(CX, CY - 95, CX, CY + 95)), { width: 3, progress: pr, seed: 304, alpha: a, passes: 1 });
    pen(M(ell(CX, CY, 34, 34, 16)), { closed: true, width: 3, progress: pr, seed: 305, alpha: a, passes: 1 });
    V = (p) => p;
  }
  for (const s of SEATS) {
    if (s.foreign && t >= 7.5) continue;
    const [x, y] = P(s.x, s.y);
    const jx = jit(s.x * 13 | 0) * 0.8, jy = jit(s.y * 17 | 0) * 0.8;
    let col = EMPTY, rad = 5.5, al = a * 0.8;
    if (s.gi >= 0) {
      const p = out3(seg(t, s.delay, s.delay + 0.3));
      if (p > 0) {
        col = s.color; rad = 6.5 * p + Math.sin(p * Math.PI) * 2; al = a;
        const rc = seg(t, 7.05 + s.u * 0.3, 7.35 + s.u * 0.3);
        if (rc > 0) col = mix(s.color, s.foreign ? FOR : (s.student ? STUD : EMPTY), rc);
      }
    }
    disc(x + jx, y + jy, rad * sc, col, al);
  }
  scarf(t);
}

// ---------- scene 4: flags ----------

const GC = [CX, 1040], GR = 320;
const FLAG_COLORS = [FOR, CARD, STUD, GREEN, YELLOW, ORANGE, CYAN, NAVY];
const FLAGS = [];
{
  const R = mulberry32(21);
  const pickColors = () => {
    const n = R() < 0.6 ? 3 : 2, out = [];
    while (out.length < n) { const c = FLAG_COLORS[Math.floor(R() * FLAG_COLORS.length)]; if (!out.includes(c)) out.push(c); }
    return out;
  };
  const foreign = SEATS.filter((s) => s.foreign);
  foreign.forEach((seat, i) => {
    const d = (i / foreign.length) * 0.35;
    FLAGS.push({ id: i, seat, d, tA: 8.25 + d, lat: lerp(-0.95, 1.0, R()), lon0: lerp(-1.2, 1.2, R()), cols: pickColors(), dir: R() < 0.5 });
  });
  for (let i = 0; i < 80; i++) {
    FLAGS.push({ id: 200 + i, seat: null, tA: lerp(8.45, 9.6, R()), lat: lerp(-0.95, 1.0, R()), lon0: lerp(-Math.PI, Math.PI, R()), cols: pickColors(), dir: R() < 0.5 });
  }
}

function flagAt(f, t) {
  const lam = f.lon0 + (t - 8.25) * 0.4;
  return [GC[0] + GR * Math.cos(f.lat) * Math.sin(lam), GC[1] - GR * Math.sin(f.lat), Math.cos(f.lat) * Math.cos(lam)];
}

function flag(x, y, sc, f, a, t) {
  if (a <= 0.002 || sc <= 0) return;
  const h = 58 * sc, fw = 44 * sc, fh = 30 * sc, top = y - h;
  pen([[x, y], [x, top]], { width: 3, alpha: a, seed: f.id * 3 + 1, passes: 1, amp: 1 });
  const wave = (u) => Math.sin(u * 3 + t * 6 + f.id) * 3 * sc * u;
  const n = f.cols.length;
  g.save();
  g.globalAlpha = a;
  for (let i = 0; i < n; i++) {
    const pts = [];
    if (f.dir) {
      const y0 = top + (i * fh) / n, y1 = top + ((i + 1) * fh) / n;
      for (let s = 0; s <= 4; s++) pts.push([x + (s / 4) * fw, y0 + wave(s / 4)]);
      for (let s = 4; s >= 0; s--) pts.push([x + (s / 4) * fw, y1 + wave(s / 4)]);
    } else {
      const u0 = i / n, u1 = (i + 1) / n;
      pts.push([x + u0 * fw, top + wave(u0)], [x + u1 * fw, top + wave(u1)], [x + u1 * fw, top + fh + wave(u1)], [x + u0 * fw, top + fh + wave(u0)]);
    }
    g.fillStyle = f.cols[i];
    g.beginPath(); pts.forEach((p, j) => (j ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.closePath(); g.fill();
  }
  g.restore();
  const outline = [];
  for (let s = 0; s <= 4; s++) outline.push([x + (s / 4) * fw, top + wave(s / 4)]);
  for (let s = 4; s >= 0; s--) outline.push([x + (s / 4) * fw, top + fh + wave(s / 4)]);
  pen(outline, { closed: true, width: 2.2, alpha: a, seed: f.id * 3 + 2, passes: 1, amp: 1 });
}

function globeScene(t) {
  const ga = seg(t, 7.55, 7.9) * (1 - seg(t, 9.85, 10.15));
  const rot = (t - 8.25) * 0.4;
  if (ga > 0) {
    const pr = seg(t, 7.55, 8.2);
    pen(ell(GC[0], GC[1], GR, GR, 72), { closed: true, fill: CYAN, fillAlpha: 0.07, width: 5, progress: pr, seed: 501, alpha: ga });
    for (let m = 0; m < 16; m++) {
      const lam = (m * Math.PI) / 8 + rot, z = Math.cos(lam);
      if (z <= 0) continue;
      const pts = [];
      for (let i = 0; i <= 14; i++) { const ph = -Math.PI / 2 + (i / 14) * Math.PI; pts.push([GC[0] + GR * Math.cos(ph) * Math.sin(lam), GC[1] - GR * Math.sin(ph)]); }
      pen(pts, { width: 2.5, alpha: ga * z * 0.7, progress: pr, seed: 520 + m, passes: 1 });
    }
    [-Math.PI / 3, -Math.PI / 6, 0, Math.PI / 6, Math.PI / 3].forEach((lat, i) => {
      const r = GR * Math.cos(lat), y = GC[1] - GR * Math.sin(lat);
      pen(line(GC[0] - r, y, GC[0] + r, y, 30), { width: 2.5, alpha: ga * 0.6, progress: pr, seed: 540 + i, passes: 1 });
    });
  }

  const list = [];
  for (const f of FLAGS) {
    if (f.seat && t < f.tA) {
      if (t > 8.6) continue;
      const p = inOut(seg(t, 7.5 + f.d, f.tA));
      const [ex, ey] = flagAt(f, t);
      const x = lerp(f.seat.x, ex, p), y = lerp(f.seat.y, ey, p) - Math.sin(p * Math.PI) * 160;
      disc(x, y, 6.5, FOR);
      continue;
    }
    const fp = out3(seg(t, f.tA, f.tA + 0.3));
    if (fp <= 0) continue;
    const [x, y, z] = flagAt(f, t);
    let a = clamp((z - 0.02) * 5);
    let dy = 0;
    if (t >= 9.9) {
      if (f.building) continue;
      a *= 1 - seg(t, 9.9, 10.1);
      dy = (t - 9.9) * 300;
    }
    list.push({ f, x, y: y + dy, z, a, fp });
  }
  list.sort((p, q) => p.z - q.z).forEach(({ f, x, y, a, fp }) => {
    if (f.seat) disc(x, y, 5, FOR, a);
    flag(x, y, fp, f, a, t);
  });

  // The reels spin and never stop: the answer is on the page.
  const ra = seg(t, 8.05, 8.35) * (1 - seg(t, 9.8, 10.0));
  if (ra > 0) {
    for (let r = 0; r < 3; r++) {
      const bx = 291 + r * 174, by = 1422, bw = 150, bh = 196;
      pen(rrect(bx, by, bw, bh, 22), { closed: true, fill: CARD, width: 5, seed: 600 + r, alpha: ra, progress: seg(t, 8.05, 8.4) });
      g.save();
      g.beginPath(); g.rect(bx + 6, by + 6, bw - 12, bh - 12); g.clip();
      g.font = fontOf(150, 700); g.textAlign = 'center'; g.fillStyle = INK;
      // Motion-smeared on purpose: no frame may show a readable number.
      g.filter = 'blur(9px)';
      // Spins on video time: the slowed story must not slow the reels into readable digits.
      const pos = RT * (20 + r * 6) + r * 3.7;
      const n = Math.floor(pos), fr = pos - n;
      for (let i = -2; i <= 2; i++) {
        const dgt = (((n + i) % 10) + 10) % 10;
        const y = by + bh / 2 + 54 + (i - fr) * 120;
        for (const [off, al] of [[-50, 0.14], [-25, 0.2], [0, 0.22], [25, 0.2], [50, 0.14]]) {
          g.globalAlpha = ra * al;
          g.fillText(String(dgt), bx + bw / 2, y + off);
        }
      }
      g.restore();
    }
  }
}

// ---------- scene 5: the town ----------

const O = [CX, 1130];
const cellPos = (i, j) => [O[0] + (i - j) * 64, O[1] + (i + j - 8) * 37];
const BLD = [];
{
  const R = mulberry32(33);
  for (let i = 0; i < 9; i++) {
    for (let j = 0; j < 9; j++) {
      if (j === 5 || i === 2) continue;
      if (R() < 0.28) continue;
      BLD.push({ i, j, h: 60 + R() * 110, c: cellPos(i, j), win: R() });
    }
  }
  BLD.sort((p, q) => (p.i + p.j) - (q.i + q.j) || p.i - q.i);
  BLD.forEach((b, n) => { b.n = n; });
  const vis = FLAGS.filter((f) => f.tA + 0.3 <= 9.9 && flagAt(f, 9.9)[2] > 0.1).sort((p, q) => flagAt(p, 9.9)[0] - flagAt(q, 9.9)[0]);
  [...BLD].sort((p, q) => p.c[0] - q.c[0]).forEach((b, idx) => {
    const f = vis[Math.floor((idx * vis.length) / BLD.length)];
    f.building = true;
    b.flag = f;
    b.from = flagAt(f, 9.9);
  });
}

function building(c, hh, a, alpha, seed, win) {
  const dx = 128 * a, dy = 74 * a;
  const L = [c[0] - dx, c[1]], B = [c[0], c[1] + dy], R = [c[0] + dx, c[1]], K = [c[0], c[1] - dy];
  const up = (p) => [p[0], p[1] - hh];
  const o = { closed: true, width: 3.5, alpha, amp: 1.5, passes: 1 };
  pen([L, B, up(B), up(L)], { ...o, fill: SHELL, seed });
  pen([B, R, up(R), up(B)], { ...o, fill: EMPTY, seed: seed + 1 });
  pen([up(L), up(B), up(R), up(K)], { ...o, fill: CARD, seed: seed + 2 });
  if (hh > 40 && a > 0.2) {
    g.save();
    g.globalAlpha = alpha * 0.7; g.strokeStyle = INK; g.lineWidth = 3; g.lineCap = 'round';
    const floors = Math.floor((hh - 20) / 30);
    for (let fl = 0; fl < floors; fl++) {
      for (const u of [0.3, 0.7]) {
        if ((fl * 3 + u * 10 + win * 7) % 3 < 0.8) continue;
        const x = lerp(L[0], B[0], u), y = lerp(L[1], B[1], u) - 22 - fl * 30;
        g.beginPath(); g.moveTo(x - 6, y - 3.5); g.lineTo(x + 6, y + 3.5); g.stroke();
      }
    }
    g.restore();
  }
}

function townScene(t) {
  const ta = seg(t, 9.9, 10.1) * (1 - seg(t, 11.3, 11.55));
  if (ta > 0) {
    pen([cellPos(-0.7, -0.7), cellPos(8.7, -0.7), cellPos(8.7, 8.7), cellPos(-0.7, 8.7)],
      { closed: true, fill: SHELL, fillAlpha: 0.5, width: 4, alpha: ta, progress: seg(t, 9.95, 10.35), seed: 801 });
    const river = [];
    for (let i = -0.7; i <= 8.71; i += 0.25) { const p = cellPos(i, 5); river.push([p[0], p[1] + Math.sin(i * 1.3) * 10]); }
    pen(river, { color: CYAN, width: 34, alpha: ta * 0.5, progress: seg(t, 10.1, 10.55), seed: 802, passes: 1 });
    pen(river, { color: CYAN, width: 4, alpha: ta, progress: seg(t, 10.1, 10.55), seed: 803, passes: 1 });
    const metro = [];
    for (let j = -0.7; j <= 8.71; j += 0.5) metro.push(cellPos(2, j));
    pen(metro, { color: RED, width: 10, alpha: ta, progress: seg(t, 10.3, 10.75), seed: 804, passes: 1 });
  }
  const q = inOut(seg(t, 11.15, 11.5));
  const ba = 1 - seg(t, 11.45, 11.65);
  const falling = [];
  for (const b of BLD) {
    const tS = 9.9 + (b.n / BLD.length) * 0.45, tL = tS + 0.3;
    const p = seg(t, tS, tL);
    if (p < 1) { falling.push({ b, p: p * p }); continue; }
    const gp = out3(seg(t, tL, tL + 0.3));
    const c = [b.c[0], lerp(b.c[1], 1150, q)];
    building(c, b.h * gp * (1 - q), 0.34 * (1 - q * 0.8), ba, 820 + b.n * 5, b.win);
  }
  for (const { b, p } of falling) {
    const x = lerp(b.from[0], b.c[0], p), y = lerp(b.from[1], b.c[1], p);
    flag(x, y, 1 - 0.5 * p, b.flag, 1, t);
  }
  if (ta > 0) {
    const sp = out3(seg(t, 10.7, 10.95));
    if (sp > 0) {
      const [x, y] = cellPos(2, 2.5);
      pen(ell(x, y, 30 * sp, 30 * sp, 16), { closed: true, fill: RED, color: RED, width: 3, alpha: ta, seed: 806, passes: 1 });
      g.save();
      g.globalAlpha = ta; g.font = fontOf(38 * sp, 700); g.fillStyle = CARD; g.textAlign = 'center';
      g.fillText('М', x, y + 13 * sp);
      g.restore();
    }
  }
}

// ---------- scene 5b: back through the centuries ----------

function student(x, y, run, a) {
  const ph = RT * 16;
  const sw = Math.sin(ph) * run, bob = Math.abs(Math.cos(ph)) * 6 * run;
  const o = { width: 6, alpha: a, color: STUD, passes: 1, amp: 1.2 };
  const hy = y - 128 - bob;
  pen([[x, hy + 20], [x, y - 58 - bob]], { ...o, seed: 950 });
  pen([[x, y - 58 - bob], [x + sw * 24, y - 2]], { ...o, seed: 951 });
  pen([[x, y - 58 - bob], [x - sw * 24, y - 2]], { ...o, seed: 952 });
  pen([[x, hy + 36], [x - 24 - sw * 10, hy + 64]], { ...o, seed: 953 });
  pen([[x, hy + 36], [x + 18 + sw * 10, hy + 66]], { ...o, seed: 954 });
  pen(ell(x, hy, 20, 20, 14), { closed: true, fill: STUD, color: STUD, width: 3, alpha: a, seed: 955, passes: 1 });
  pen([[x - 30, hy - 20], [x, hy - 32], [x + 30, hy - 20], [x, hy - 8]], { closed: true, fill: INK, width: 2, alpha: a, seed: 956, passes: 1 });
  pen([[x + 22, hy - 21], [x + 26, hy - 2]], { width: 3, alpha: a, seed: 957, passes: 1 });
}

const backAt = (t) => 700 * Math.pow(seg(t, 11.55, 12.55), 2.6);   // years rewound

function rulerScene(t) {
  const a = seg(t, 11.3, 11.5) * (1 - seg(t, 12.45, 12.7));
  if (a <= 0) return;
  const LY = 1150, NOW = 2026, PX = 3.4, AT = 860;
  pen(line(40, LY, 1040, LY, 40), { width: 5, alpha: a, progress: seg(t, 11.3, 11.6), seed: 901 });
  const q = seg(t, 11.55, 12.55);
  const back = backAt(t);
  const vel = 700 * 2.6 * Math.pow(q, 1.6) * PX * RATE;   // px per video second
  const center = NOW - back;
  const X = (Y) => AT + (Y - center) * PX;
  const blur = Math.min(8, vel / 450);
  const ta = a * seg(t, 11.45, 11.7);
  g.save();
  if (blur > 0.3) g.filter = `blur(${blur}px)`;
  const y0 = Math.ceil((center - AT / PX) / 10) * 10;
  for (let Y = y0; Y <= NOW; Y += 10) {
    const x = X(Y);
    if (x > 1060) break;
    const big = Y % 100 === 0, mid = Y % 50 === 0;
    const len = big ? 54 : mid ? 34 : 18;
    pen([[x, LY], [x, LY + len]], { width: big ? 5 : 3.5, alpha: ta, seed: Y, passes: 1, amp: 1 });
  }
  // The years themselves are never named — only «today» is, and it leaves too.
  const xn = X(NOW);
  if (xn < 1080) {
    pen([[xn, LY], [xn, LY + 54]], { width: 5, color: HSE, alpha: ta, seed: 990, passes: 1 });
    g.globalAlpha = ta; g.fillStyle = HSE; g.font = fontOf(52, 700); g.textAlign = 'center';
    g.fillText('сегодня', xn, LY + 120);
  }
  g.restore();
  student(AT, LY - 4, clamp(vel / 300), ta);
}

function render(rt) {
  const t = storyAt(rt);
  RT = rt; T = t;
  RATE = (storyAt(rt + 0.005) - storyAt(rt - 0.005)) / 0.01;
  BOIL = Math.floor(rt * 8);

// ---------- sound ----------

function scheduleSound(ac, out, T0) {
  const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const ch = buf.getChannelData(0), R = mulberry32(99);
  for (let i = 0; i < ch.length; i++) ch[i] = R() * 2 - 1;
  const at = (s) => T0 + s;

  const envelope = (gn, s, dur, peak, attack, hold) => {
    const p = gn.gain;
    p.setValueAtTime(0.0001, at(s));
    p.linearRampToValueAtTime(peak, at(s) + attack);
    if (hold) { p.setValueAtTime(peak, at(s) + dur * 0.75); p.linearRampToValueAtTime(0.0001, at(s) + dur); }
    else p.exponentialRampToValueAtTime(0.0001, at(s) + dur);
  };
  const tone = (s, f, dur, { type = 'sine', gain = 0.2, attack = 0.004, f2 = null } = {}) => {
    const o = ac.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f, at(s));
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, at(s) + dur);
    const gn = ac.createGain();
    envelope(gn, s, dur, gain, attack, false);
    o.connect(gn).connect(out);
    o.start(at(s)); o.stop(at(s) + dur + 0.05);
  };
  const noise = (s, dur, { type = 'bandpass', f = 1000, f2 = null, q = 1, gain = 0.2, attack = 0.005, hold = false } = {}) => {
    const src = ac.createBufferSource();
    src.buffer = buf; src.loop = true;
    const bq = ac.createBiquadFilter();
    bq.type = type; bq.Q.value = q;
    bq.frequency.setValueAtTime(f, at(s));
    if (f2) bq.frequency.exponentialRampToValueAtTime(f2, at(s) + dur);
    const gn = ac.createGain();
    envelope(gn, s, dur, gain, attack, hold);
    src.connect(bq).connect(gn).connect(out);
    src.start(at(s), R() * 1.5); src.stop(at(s) + dur + 0.05);
  };

  // Events are placed on the story and land on the video second it is shown at.
  const S = realAt;
  const span = (a, b) => S(b) - S(a);

  // doors: the hum of the station holds the pause after they shut
  noise(0, S(2.0), { type: 'lowpass', f: 150, gain: 0.16, attack: 0.4, hold: true });
  tone(S(0.05), 659, 0.7, { type: 'triangle', gain: 0.12 });
  tone(S(0.4), 523, 1.0, { type: 'triangle', gain: 0.12 });
  noise(S(0.45), span(0.45, 1.3), { type: 'highpass', f: 2500, gain: 0.08, attack: 0.08, hold: true });
  tone(S(1.27), 95, 0.3, { gain: 0.5, f2: 45 });
  noise(S(1.27), 0.1, { type: 'lowpass', f: 700, gain: 0.35 });

  // train: the wheels knock as often as the train really passes on screen
  noise(S(1.9), span(1.9, 4.7), { type: 'lowpass', f: 160, gain: 0.35, attack: 0.9, hold: true });
  for (let s = S(2.0); s < S(4.3);) {
    const v = (shiftAt(storyAt(s + 0.02)) - shiftAt(storyAt(s))) / 0.02;
    if (v < 200) { s += 0.05; continue; }
    for (const d of [0, 0.09]) {
      noise(s + d, 0.05, { f: 1800, q: 3, gain: 0.22 });
      tone(s + d, 150, 0.08, { gain: 0.2, f2: 80 });
    }
    s += clamp(900 / v, 0.26, 0.7);
  }

  // arena: a stand of people breathing under the whole scene
  noise(S(4.9), span(4.9, 7.4), { type: 'lowpass', f: 260, gain: 0.2, attack: 0.6, hold: true });
  noise(S(4.25), 0.8, { f: 300, f2: 3000, q: 0.8, gain: 0.16, attack: 0.3 });
  [1, 1.26, 1.5, 2, 2.52].forEach((m, gi) => tone(S(5.0 + gi * 0.24), 523 * m, 0.3, { type: 'triangle', gain: 0.1 }));
  [523, 659, 784, 1046].forEach((f) => tone(S(6.3), f, 1.8, { type: 'triangle', gain: 0.05, attack: 0.02 }));

  // flags
  noise(S(7.45), 0.7, { f: 400, f2: 2500, q: 0.8, gain: 0.2, attack: 0.3 });
  noise(S(7.6), span(7.6, 9.9), { type: 'lowpass', f: 220, gain: 0.3, attack: 0.5, hold: true });
  for (let s = S(8.05); s < S(9.8); s += 0.045) noise(s, 0.015, { f: 2600 + R() * 1400, q: 4, gain: 0.2 });
  for (let i = 0; i < 16; i++) tone(S(lerp(8.3, 9.6, R())), 900 + R() * 600, 0.07, { gain: 0.09 });

  // town: a low bed under the whole of it, a knock for every other building
  // that lands, and the station chiming when it opens
  noise(S(10.0), span(10.0, 11.32), { type: 'lowpass', f: 240, gain: 0.22, attack: 0.5, hold: true });
  tone(S(10.8), 659, 0.5, { type: 'triangle', gain: 0.09 });
  tone(S(10.95), 880, 0.6, { type: 'triangle', gain: 0.07 });
  BLD.forEach((b) => {
    if (b.n % 2) return;
    tone(S(9.9 + (b.n / BLD.length) * 0.45 + 0.3), 120 + R() * 100, 0.12, { gain: 0.14, f2: 60 });
  });

  // centuries: a click for every decade that passes under the student
  noise(S(11.3), span(11.3, 12.5), { type: 'lowpass', f: 200, gain: 0.25, attack: 0.3, hold: true });
  noise(S(11.6), span(11.6, 12.5), { f: 3000, f2: 300, q: 0.7, gain: 0.22, attack: 0.6 });
  for (let s = S(11.55), decade = 0, lastClick = -1; s < S(12.5); s += 0.01) {
    const now = Math.floor(backAt(storyAt(s)) / 10);
    if (now !== decade && s - lastClick >= 0.025) { noise(s, 0.02, { f: 2000, q: 3, gain: 0.22 }); lastClick = s; decade = now; }
  }

  // title
  [392, 494, 587, 784].forEach((f) => tone(S(12.73), f, 3.0, { type: 'triangle', gain: 0.1, attack: 0.02 }));
  tone(S(13.15), 880, 0.14, { gain: 0.14, f2: 1320 });
  // a tail under the title, so the video does not end on dead silence
  [261.6, 392].forEach((f) => tone(S(13.4), f, 4.2, { type: 'triangle', gain: 0.06, attack: 0.4 }));
}

// ---------- player and recorder ----------

const $ = (name) => document.querySelector(`[data-el="${name}"]`);
const playBtn = $('play'), recBtn = $('record'), scrub = $('scrub'), timeEl = $('time'), statusEl = $('status');
const showTime = (t) => { timeEl.textContent = `${t.toFixed(2).replace('.', ',')} с`; };

const ready = Promise.all([...[400, 600, 700].map((w) => document.fonts.load(`${w} 80px "HSE Sans"`)), TABLO.decode()]);

const FPS = 30, SR = 48000;

let busy = false;
const setBusy = (on) => { busy = on; playBtn.disabled = recBtn.disabled = on; };
// Timers are throttled in a background tab; a message port is not.
const breathe = () => new Promise((r) => { const ch = new MessageChannel(); ch.port1.onmessage = () => r(); ch.port2.postMessage(0); });
const bytes = (d) => (ArrayBuffer.isView(d) ? new Uint8Array(d.buffer, d.byteOffset, d.byteLength).slice() : new Uint8Array(d));

async function play() {
  if (busy) return;
  setBusy(true);
  await ready;
  const ac = new AudioContext();
  const master = ac.createGain();
  master.gain.value = 0.8;
  const comp = ac.createDynamicsCompressor();
  master.connect(comp);
  comp.connect(ac.destination);
  const T0 = ac.currentTime + 0.1;
  scheduleSound(ac, master, T0);
  await new Promise((resolve) => {
    const tick = () => {
      const t = ac.currentTime - T0;
      const c = clamp(t, 0, DUR);
      render(c);
      scrub.value = c; showTime(c);
      if (t < DUR + 0.2) requestAnimationFrame(tick); else resolve();
    };
    requestAnimationFrame(tick);
  });
  ac.close();
  setBusy(false);
}

// ---------- mp4 by hand: H.264 + AAC, moov in front ----------

function cat(parts) {
  let n = 0;
  for (const p of parts) n += p.length;
  const out = new Uint8Array(n);
  let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}
const u8 = (...b) => new Uint8Array(b);
const u16 = (n) => u8((n >>> 8) & 255, n & 255);
const u32 = (n) => u8((n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255);
const ascii = (s) => new TextEncoder().encode(s);
const box = (type, ...parts) => { const body = cat(parts.flat()); return cat([u32(body.length + 8), ascii(type), body]); };
const full = (type, version, flags, ...parts) => box(type, u8(version, (flags >>> 16) & 255, (flags >>> 8) & 255, flags & 255), ...parts);

function muxMp4(video, avcC, audio, asc) {
  const VT = 90000, vDelta = VT / FPS;
  const nV = video.length, nA = audio.length;
  const vMs = Math.round((nV / FPS) * 1000), aMs = Math.round(((nA * 1024) / SR) * 1000);
  const MATRIX = cat([0x00010000, 0, 0, 0, 0x00010000, 0, 0, 0, 0x40000000].map(u32));
  const ftyp = box('ftyp', ascii('isom'), u32(0x200), ascii('isom'), ascii('iso2'), ascii('avc1'), ascii('mp41'));

  const build = (base) => {
    let off = base;
    const vOff = video.map((s) => { const o = off; off += s.data.length; return o; });
    const aOff = audio.map((s) => { const o = off; off += s.length; return o; });
    const tkhd = (id, dur, vol, w, h) => full('tkhd', 0, 3, u32(0), u32(0), u32(id), u32(0), u32(dur),
      new Uint8Array(8), u16(0), u16(0), u16(vol), u16(0), MATRIX, u32(w * 65536), u32(h * 65536));
    const mdhd = (ts, dur) => full('mdhd', 0, 0, u32(0), u32(0), u32(ts), u32(dur), u16(0x55c4), u16(0));
    const hdlr = (type, name) => full('hdlr', 0, 0, u32(0), ascii(type), new Uint8Array(12), ascii(name + '\0'));
    const dinf = () => box('dinf', full('dref', 0, 0, u32(1), full('url ', 0, 1)));
    const stsc = () => full('stsc', 0, 0, u32(1), u32(1), u32(1), u32(1));
    const stsz = (sizes) => full('stsz', 0, 0, u32(0), u32(sizes.length), ...sizes.map(u32));
    const stco = (offs) => full('stco', 0, 0, u32(offs.length), ...offs.map(u32));

    const avc1 = box('avc1', new Uint8Array(6), u16(1), u16(0), u16(0), new Uint8Array(12), u16(W), u16(H),
      u32(0x00480000), u32(0x00480000), u32(0), u16(1), new Uint8Array(32), u16(0x18), u16(0xffff), box('avcC', avcC));
    const keys = video.map((s, i) => (s.key ? i + 1 : 0)).filter(Boolean);
    const vtrak = box('trak', tkhd(1, vMs, 0, W, H), box('mdia', mdhd(VT, nV * vDelta), hdlr('vide', 'VideoHandler'),
      box('minf', full('vmhd', 0, 1, u16(0), u16(0), u16(0), u16(0)), dinf(), box('stbl',
        full('stsd', 0, 0, u32(1), avc1),
        full('stts', 0, 0, u32(1), u32(nV), u32(vDelta)),
        full('stss', 0, 0, u32(keys.length), ...keys.map(u32)),
        stsc(), stsz(video.map((s) => s.data.length)), stco(vOff)))));

    const desc = (tag, body) => cat([u8(tag, body.length), body]);
    const esds = full('esds', 0, 0, desc(0x03, cat([u16(2), u8(0),
      desc(0x04, cat([u8(0x40, 0x15), u8(0, 0, 0), u32(192000), u32(192000), desc(0x05, asc)])),
      desc(0x06, u8(0x02))])));
    const mp4a = box('mp4a', new Uint8Array(6), u16(1), u16(0), u16(0), u32(0), u16(2), u16(16), u16(0), u16(0), u32(SR * 65536), esds);
    const atrak = box('trak', tkhd(2, aMs, 0x0100, 0, 0), box('mdia', mdhd(SR, nA * 1024), hdlr('soun', 'SoundHandler'),
      box('minf', full('smhd', 0, 0, u16(0), u16(0)), dinf(), box('stbl',
        full('stsd', 0, 0, u32(1), mp4a),
        full('stts', 0, 0, u32(1), u32(nA), u32(1024)),
        stsc(), stsz(audio.map((s) => s.length)), stco(aOff)))));

    const mvhd = full('mvhd', 0, 0, u32(0), u32(0), u32(1000), u32(Math.max(vMs, aMs)), u32(0x00010000), u16(0x0100),
      new Uint8Array(10), MATRIX, new Uint8Array(24), u32(3));
    return box('moov', mvhd, vtrak, atrak);
  };

  // The sample offsets depend on the size of moov itself, which does not depend on them.
  const moov = build(ftyp.length + build(0).length + 8);
  let mdat = 8;
  for (const s of video) mdat += s.data.length;
  for (const s of audio) mdat += s.length;
  return new Blob([ftyp, moov, u32(mdat), ascii('mdat'), ...video.map((s) => s.data), ...audio], { type: 'video/mp4' });
}

// The video is built frame by frame rather than recorded live, so a slow
// machine or a hidden tab cannot drop frames.
async function exportVideo() {
  if (busy) return;
  if (typeof VideoEncoder === 'undefined' || typeof AudioEncoder === 'undefined') {
    statusEl.textContent = 'Этот браузер не умеет собирать видео. Открой страницу в свежем Chrome.';
    return;
  }
  setBusy(true);
  await ready;
  let failure = null;
  try {
    statusEl.textContent = 'Свожу звук…';
    const oac = new OfflineAudioContext(2, Math.round(SR * DUR), SR);
    const master = oac.createGain();
    master.gain.value = 0.8;
    const comp = oac.createDynamicsCompressor();
    master.connect(comp);
    comp.connect(oac.destination);
    scheduleSound(oac, master, 0);
    const mixdown = await oac.startRendering();
    // Feeds play quietly: bring the peak up to -1 dBFS.
    let peak = 0;
    for (let c = 0; c < 2; c++) for (const v of mixdown.getChannelData(c)) peak = Math.max(peak, Math.abs(v));
    if (peak > 0) {
      for (let c = 0; c < 2; c++) {
        const d = mixdown.getChannelData(c);
        for (let i = 0; i < d.length; i++) d[i] *= 0.89 / peak;
      }
    }

    const audio = [];
    let asc = null;
    const aenc = new AudioEncoder({
      output: (chunk, meta) => {
        if (!asc && meta?.decoderConfig?.description) asc = bytes(meta.decoderConfig.description);
        const d = new Uint8Array(chunk.byteLength); chunk.copyTo(d); audio.push(d);
      },
      error: (e) => { failure = e; }
    });
    aenc.configure({ codec: 'mp4a.40.2', sampleRate: SR, numberOfChannels: 2, bitrate: 192000 });
    const left = mixdown.getChannelData(0), right = mixdown.getChannelData(1);
    for (let off = 0; off < mixdown.length; off += 4800) {
      const n = Math.min(4800, mixdown.length - off);
      const planar = new Float32Array(n * 2);
      planar.set(left.subarray(off, off + n), 0);
      planar.set(right.subarray(off, off + n), n);
      const data = new AudioData({ format: 'f32-planar', sampleRate: SR, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round((off / SR) * 1e6), data: planar });
      aenc.encode(data);
      data.close();
    }
    await aenc.flush();
    aenc.close();

    const video = [];
    let avcC = null;
    const venc = new VideoEncoder({
      output: (chunk, meta) => {
        if (!avcC && meta?.decoderConfig?.description) avcC = bytes(meta.decoderConfig.description);
        const d = new Uint8Array(chunk.byteLength); chunk.copyTo(d);
        video.push({ data: d, key: chunk.type === 'key', ts: chunk.timestamp });
      },
      error: (e) => { failure = e; }
    });
    venc.configure({ codec: 'avc1.640028', width: W, height: H, bitrate: 14_000_000, framerate: FPS, avc: { format: 'avc' } });
    const frames = Math.round(DUR * FPS);
    for (let i = 0; i < frames && !failure; i++) {
      const t = i / FPS;
      render(t);
      const frame = new VideoFrame(canvas, { timestamp: Math.round(t * 1e6), duration: Math.round(1e6 / FPS) });
      venc.encode(frame, { keyFrame: i % FPS === 0 });
      frame.close();
      while (venc.encodeQueueSize > 4) await new Promise((r) => venc.addEventListener('dequeue', r, { once: true }));
      if (i % 10 === 0) {
        scrub.value = t; showTime(t);
        statusEl.textContent = `Собираю кадры: ${Math.round((i / frames) * 100)}%`;
        await breathe();
      }
    }
    await venc.flush();
    venc.close();
    if (failure) throw failure;
    if (!avcC) throw new Error('кодировщик не отдал параметры видео');
    if (video.some((s, i) => i && s.ts <= video[i - 1].ts)) throw new Error('кадры пришли не по порядку');
    statusEl.textContent = 'Сохраняю…';
    await save(muxMp4(video, avcC, audio, asc || u8(0x11, 0x90)), 'mp4');
  } catch (e) {
    statusEl.textContent = `Не получилось: ${e.message || e}`;
  }
  setBusy(false);
}

// With tools/teaser-server.py the file lands in teaser/; with any other server it downloads.
async function save(blob, ext) {
  const name = `teaser.${ext}`;
  try {
    const r = await fetch(`./${name}`, { method: 'PUT', body: blob });
    if (r.ok) { statusEl.textContent = `Готово: teaser/${name} сохранен в проекте.`; return; }
  } catch (e) { /* no upload endpoint, fall back to a download */ }
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = name; link.textContent = `Скачать ${name}`;
  statusEl.textContent = 'Готово. ';
  statusEl.appendChild(link);
  link.click();
}

playBtn.addEventListener('click', play);
recBtn.addEventListener('click', exportVideo);
scrub.addEventListener('input', () => { if (!busy) { const t = Number(scrub.value); render(t); showTime(t); } });

ready.then(() => {
  const t = clamp(Number(new URLSearchParams(location.search).get('t')) || 0, 0, DUR);
  scrub.value = t; showTime(t);
  render(t);
});

window.renderTeaser = render;
</script>
</body>
