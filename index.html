<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>На сколько большая</title>
<link rel="stylesheet" href="styles/fonts.css" />
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/layout.css" />
</head>
<body>
<script>
  // The page is read beat by beat, so a reload starts it over: without this the
  // browser puts the reader back where they had scrolled to, in the middle of a
  // section that has not been told yet.
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.scrollTo(0, 0);
</script>
<main>
  <header class="page-header">
    <div class="page-header-inner">
      <h1><span class="title-word">На</span> <span class="title-word">сколько</span> <span class="title-word">б<a class="hse-o-link" href="https://www.hse.ru/" target="_blank" rel="noopener" title="Сайт Вышки" aria-label="Сайт НИУ ВШЭ"><svg class="hse-o" viewBox="0 0 283.47 283.47" aria-hidden="true" focusable="false"><circle class="hse-o-disc" cx="141.73" cy="141.74" r="141.73"/><path class="hse-o-mark" d="M135.6,133.32c32.26,0,44.81,21.45,44.81,60.69v29.51h-20.69v-63.35h-23.9v63.42h-18.28V53.65h18.78c7.03,0,17.71,1.58,25.25,10.95c3.93,4.73,6.34,11.04,7.19,17.38h-32.94v9.35h33.23c-0.27,6.04-1.49,12.8-7.42,19.97c-5.2,6.51-13.76,12.56-25.83,12.56c-0.06,0-0.13,0-0.2,0V133.32 M206.41,197.55c0-34.86-11.26-58.29-40.45-68.6c9.21-3.77,14.82-9.58,18.49-13.99c7.01-8.06,9.88-17.96,9.88-27.31c0-7.56-2.08-22.65-15.35-33.04c-9.1-7.04-17.16-10.43-36.43-10.43h-9.75c-0.3-0.01-0.6-0.01-0.96-0.01H91.65v189.79h114.76V197.55z"/></svg></a><span class="sr-only">о</span>льш<span class="stressed">а<i></i></span>я</span></h1>
      <div class="page-header-text">
        <p>Вышка настолько большая, что это уже практически целый город. Сейчас покажем.</p>
        <p>Осторожно, двери закрываются!</p>
      </div>
    </div>

    <!-- Nudge to scroll: fades out as soon as the reader does. -->
    <div class="scroll-hint" data-el="scrollHint" aria-hidden="true">
      <span class="scroll-hint-text">Листай<span class="on-keys"> или жми пробел</span></span>
      <!-- Appears once there is something to go back to. -->
      <span class="scroll-hint-back">Назад — клик по полоске сверху</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3 L12 17" />
        <path d="M5.5 11 L12 17.5 L18.5 11" />
      </svg>
    </div>
  </header>

  <div id="page"></div>

  <footer class="page-footer">
    <span>Показатели за 2025 год</span>
    <a href="https://data.hse.ru" target="_blank" rel="noopener">© Дирекция по аналитике и управлению данными НИУ ВШЭ</a>
  </footer>
</main>

<script type="module">
  import * as metro from './viz/metro.js';
  import * as stadium from './viz/stadium.js';
  import * as world from './viz/world.js';
  import * as area from './viz/area.js';
  import * as study from './viz/study.js';
  import * as professions from './viz/professions.js';
  import * as each from './viz/each.js';
  import { mountProgress, introRunner, mountTitleMark } from './lib/page.js';
  import { mountStepper } from './lib/stepper.js';

  // Every visualisation on the page, in the order it appears.
  // To add one: write viz/<name>.js, import it, append it here.
  const MODULES = [metro, stadium, world, area, study, professions, each];

  const page = document.getElementById('page');

  // The page is read beat by beat: the shell lays the sections out and hands
  // the stepper what each of them can play — see lib/stepper.js.
  const plan = MODULES.map((mod, index) => {
    const section = document.createElement('section');
    section.className = 'viz-section';
    section.id = mod.meta.id;
    section.innerHTML = `
      <div class="viz-container">
        ${mod.meta.lead ? `
          <div class="viz-lead" data-exit="${mod.meta.lead.exit || 'aside'}" data-fit="${mod.meta.lead.fit || 'top'}" data-together="${mod.meta.lead.together ? 'block' : ''}">
            <div class="viz-lead-value">${mod.meta.lead.value}</div>
            <p class="viz-lead-text">${mod.meta.lead.text}</p>
          </div>
        ` : ''}
        <div class="viz-intro-hold">
          <div class="viz-header">
            <h2>${mod.meta.title}</h2>
            <p>${mod.meta.subtitle}</p>
          </div>
        </div>
        <div class="viz-body"></div>
      </div>
    `;
    page.appendChild(section);

    // The first section opens the page; any other can ask for the same card
    // with `intro: true`, and for it to arrive in parts with `introStages`.
    const opening = (index === 0 || mod.meta.intro)
      ? introRunner(section, mod.meta.introStages, mod.meta.introScale)
      : null;
    if (opening) opening.run(0);

    let api = null;
    return {
      section,
      opening,
      steps: mod.meta.steps || 0,
      opensOnStep: !!mod.meta.opensOnStep,
      // The figure this block ends on, handed over to the next — see lib/stepper.js.
      handoff: mod.meta.handoff || null,
      setStep: (i) => api && api.step && api.step(i),
      // Whether step i has to wait for the reader — see lib/stepper.js. With
      // { quiet: true } the block only answers and shows nothing.
      hold: (i, options) => !!(api && api.hold && api.hold(i, options)),
      // A section is built on its way onto the screen, not before: whatever it
      // animates on start then plays in front of the reader.
      build: () => { if (!api) api = mod.init(section.querySelector('.viz-body')) || {}; }
    };
  });

  const progress = mountProgress(MODULES.map((mod) => mod.meta.title));
  mountTitleMark();
  const story = mountStepper(plan, {
    onProgress: progress.set,
    // One last beat after the story: the page lifts to show the credits.
    finale: document.querySelector('.page-footer')
  });
  // The progress bar doubles as the way back: a click on a block goes there.
  progress.pick(story.toBlock);

</script>
</body>
</html>
