<script>
  // Страница перечитывается после смены раскладки (keep() в lib/stepper.js) и
  // сейчас поедет на место читателя. До того она спрятана — иначе мелькнула
  // бы обложка, с которой она поднимается. Снимает это каркас, когда читатель
  // на месте; через три секунды — в любом случае.
  try {
    if (sessionStorage.getItem('нсб-раздел') !== null) {
      document.documentElement.classList.add('is-returning');
      setTimeout(() => document.documentElement.classList.remove('is-returning'), 3000);
    }
  } catch (err) { /* без хранилища возвращаться и не к чему */ }

  // Модуль страницы может не запуститься вовсе, если новая разметка встретит
  // сохраненный браузером старый JS без нужного экспорта. Тогда сам модуль не
  // может вызвать stale() ниже. Этот обычный скрипт успевает раньше: освежает
  // уже запрошенные файлы и один раз перечитывает страницу.
  window.addEventListener('error', (event) => {
    if (!/^https?:$/.test(location.protocol) || !(event.error instanceof SyntaxError)
        || document.querySelector('#page .viz-section')) return;
    try {
      if (event.filename && new URL(event.filename, location.href).origin !== location.origin) return;
      const key = 'нсб-обновлена';
      if (Date.now() - (Number(sessionStorage.getItem(key)) || 0) < 60000) return;
      sessionStorage.setItem(key, String(Date.now()));
    } catch (err) { return; }
    const urls = performance.getEntriesByType('resource').map((r) => r.name)
      .filter((url) => new URL(url).origin === location.origin && /\.(js|css)$/.test(url.split(/[?#]/)[0]));
    urls.push(location.href);
    Promise.all([...new Set(urls)].map((url) => fetch(url, { cache: 'reload' }).catch(() => null)))
      .then(() => location.reload());
  });
</script>

<script type="module">
  // Версии в адресах не дают старым подписям из кэша вернуться после
  // обновления страницы. При изменении файла меняется и его v.
  import * as metro from './viz/metro.js?v=2';
  import * as stadium from './viz/stadium.js';
  import * as world from './viz/world.js?v=2';
  import * as area from './viz/area.js?v=2';
  import * as study from './viz/study.js';
  import * as professions from './viz/professions.js?v=3';
  // Две дальние главы грузятся не со страницей, а по требованию: их код —
  // треть всего, что телефон качает до кнопки «Начать», а нужен он
  // главами позже. При старте каркасу хватает их метаданных (заголовки,
  // полоска, число шагов, переходы) — они лежат отдельным маленьким файлом,
  // и сам модуль берет их оттуда же. Как и когда грузится код — см. codeOf()
  // и build() ниже.
  import { meta as spaceMeta } from './viz/space.meta.js';
  import { meta as eachMeta } from './viz/each.meta.js';
  const space = { meta: spaceMeta, load: () => import('./viz/space.js?v=2') };
  const each = { meta: eachMeta, load: () => import('./viz/each.js?v=3') };
  import { mountProgress, introRunner, mountTitleMark, mountWindowSize } from './lib/page.js';
  import { nameSwitches } from './lib/ui.js';
  // Сверяем версию данных до сборки страницы. Старый файл без этого экспорта
  // или с другим номером запускает восстановление из кэша через <head>.
  import { DATA_REVISION } from './data/hse.js';
  import { mountStepper } from './lib/stepper.js';
  import { bindShortWords, keepBound } from './lib/typo.js';

  // Every visualisation on the page, in the order it appears.
  // To add one: write viz/<name>.js, import it, append it here.
  const MODULES = [metro, stadium, world, area, study, professions, space, each];

  // Держать вровень с DATA_REVISION в data/hse.js при обновлении чисел.
  const EXPECTED_DATA_REVISION = 2;
  if (DATA_REVISION !== EXPECTED_DATA_REVISION) throw new SyntaxError('Устарели данные Вышки');

  // Высота окна, померенная руками: титульный экран считает свой рост по ней,
  // а не по dvh, который на айфоне не поспевает за панелью браузера.
  mountWindowSize();

  const page = document.getElementById('page');

  // The page is read beat by beat: the shell lays the sections out and hands
  // the stepper what each of them can play — see lib/stepper.js.
  const plan = MODULES.map((mod, index) => {
    const section = document.createElement('section');
    // A block that hands its picture over has it stand under this lead-in —
    // known from the start, so the lead-in is placed for it from the first frame.
    const given = index > 0 && MODULES[index - 1].meta.carry && mod.meta.lead;
    section.className = given ? 'viz-section has-backdrop' : 'viz-section';
    section.id = mod.meta.id;
    section.innerHTML = `
      <div class="viz-container">
        ${mod.meta.lead ? `
          <div class="viz-lead" data-exit="${mod.meta.lead.exit || 'aside'}" data-fit="${mod.meta.lead.fit || 'top'}" data-together="${mod.meta.lead.together ? 'block' : ''}">
            <div class="viz-lead-value">${mod.meta.lead.value}</div>
            <p class="viz-lead-text">${mod.meta.lead.text}</p>
          </div>
        ` : ''}
        <div class="viz-intro-hold">
          <div class="viz-header">
            <h2>${mod.meta.title}</h2>
            <p>${mod.meta.subtitle}</p>
          </div>
        </div>
        <div class="viz-body"></div>
      </div>
    `;
    page.appendChild(section);
    // Висячие предлоги — до того, как каркас мерит переходный экран и
    // карточку: мерить нужно ту строку, которую читатель увидит. См. lib/typo.js.
    bindShortWords(section);

    // The first section opens the page; any other can ask for the same card
    // with `intro: true`, and for it to arrive in parts with `introStages`.
    // А `card: false` — наоборот: открытие есть, карточки нет. Заголовок стоит
    // на своем месте и приходит вместе с блоком, одним тактом.
    const opening = (index === 0 || mod.meta.intro)
      ? introRunner(section, mod.meta.introStages, mod.meta.introScale,
                    mod.meta.card !== false)
      : null;
    if (opening) opening.run(0);

    let api = null;
    // Пока код раздела в пути, каркас уже может просить о нем: поставить шаг,
    // открыть картинку. Последняя такая просьба запоминается и исполняется,
    // как только раздел собран, — чтобы он пришел в том состоянии, в котором
    // его ждут, а не в начальном.
    let want = null;
    let wantOpen = false;
    let retry = 0;
    const entry = {
      section,
      opening,
      steps: mod.meta.steps || 0,
      // Блок, который на телефоне читается кадрами, а не прокруткой: страница
      // останавливается на нем, и каждое касание играет следующий кадр
      // целиком — см. «Чтение кадрами» в lib/stepper.js.
      taps: !!mod.meta.taps,
      opensOnStep: !!mod.meta.opensOnStep,
      // И следующий шаг — тем же тактом, что посадка карточки: см. «Карточка
      // и первый шаг одним тактом» в CLAUDE.md.
      joinsCard: !!mod.meta.joinsCard,
      // The figure this block ends on, handed over to the next — see lib/stepper.js.
      handoff: mod.meta.handoff || null,
      // How the block arrives, if not by the page travelling to it — see
      // CURTAINS in lib/stepper.js. A block that ends on a photograph being
      // taken (`meta.flash`) hands the next one over in the flash of the
      // camera.
      curtain: index > 0 && MODULES[index - 1].meta.flash ? 'flash' : null,
      // The picture it hands over as well, if any — see lib/stepper.js.
      carry: () => (api && api.carry) || null,
      setStep: (i) => {
        if (!api) { want = i; return undefined; }
        return api.step && api.step(i);
      },
      // «Будь в состоянии i», а не «сыграй шаг i». Читатель пришел сюда из
      // другого места — шагом назад, прыжком по полоске, возвратом из футера, —
      // и смотреть заново то, что уже видел, не просил. Блок, который умеет
      // различать эти два случая, говорит об этом своим restore(); остальные
      // по-прежнему играют шаг, как и раньше.
      setState: (i) => {
        if (!api) { want = i; return undefined; }
        return api.restore ? api.restore(i) : (api.step && api.step(i));
      },
      // How far the next state of the story is, in pixels of scroll — the
      // block says it itself, because only it knows how its travel is cut up.
      // Nought when there is nothing ahead. See «Далее» in lib/stepper.js.
      ahead: () => (api && api.ahead ? api.ahead() : 0),
      // И назад — до предыдущего состояния. Отвечает на это не всякий блок:
      // тот, что молчит, назад листается экраном, как и раньше.
      behind: () => (api && api.behind ? api.behind() : 0),
      // Whether step i has to wait for the reader — see lib/stepper.js. With
      // { quiet: true } the block only answers and shows nothing.
      hold: (i, options) => !!(api && api.hold && api.hold(i, options)),
      // The same for a part of the lead-in screen, by the number it is marked
      // with in the markup: a screen that asks something waits for an answer.
      holdIntro: (stage, options) => !!(api && api.holdIntro && api.holdIntro(stage, options)),
      // How long step i plays, in ms, if it needs more than a beat.
      span: (i) => (api && api.span ? api.span(i) : 0),
      // A section is built on its way onto the screen, not before: whatever it
      // animates on start then plays in front of the reader.
      //
      // Код раздела, вынесенного из начальной загрузки, к этому моменту обычно
      // уже здесь: его тянут заранее (fetch ниже). Если еще нет, сборка ждет
      // его и случается, как только он придет, — с тем шагом, о котором
      // каркас успел попросить (want). Если сеть подвела — пробует снова, а
      // страница тем временем листается дальше.
      build: () => {
        if (api) return;
        if (!mod.init) {
          codeOf(mod).then(late, (err) => {
            if (stale(err)) return;
            clearTimeout(retry);
            retry = setTimeout(entry.build, 3000);
            window.addEventListener('online', entry.build, { once: true });
          });
          return;
        }
        api = mod.init(section.querySelector('.viz-body')) || {};
        // Сразу, а не по наблюдателю: блок может мерить свой текст следом.
        bindShortWords(section);
        // Раздел собирается на главу раньше, чем до него дойдут; код главы за
        // ним в это время и тянем — на две главы вперед.
        if (plan[index + 1]) plan[index + 1].fetch();
        // The switches of the block say what they switch and whether they are
        // on — read off the markup they are already in, see lib/ui.js.
        nameSwitches(section);
        // Выбор читателя, привезенный через границу узкого и широкого экрана
        // (keep() в lib/stepper.js), — сразу, как блок собран, и один раз.
        if (entry.pending) {
          const data = entry.pending;
          entry.pending = null;
          if (api.recall) {
            try { api.recall(data); } catch (err) { console.error('Выбор блока не вернулся', err); }
          }
        }
      },
      // То, что читатель выбрал в блоке, — чтобы пережить перечитывание
      // страницы при смене раскладки. Блок отвечает сам, через remember().
      remember: () => (api && api.remember ? api.remember() : null),
      pending: null,
      // And whenever it comes onto the screen — first time or coming back — the
      // picture inside it starts from the beginning. See lib/stepper.js.
      open: () => {
        if (!api) { wantOpen = true; return; }
        if (api.open) api.open();
      },
      // Загрузить код раздела заранее, не собирая его.
      fetch: () => { codeOf(mod).catch(() => {}); }
    };

    // Сборка раздела, код которого пришел позже, чем о нем попросили. Читатель
    // за это время мог уйти дальше — тогда раздел, выросший над ним, сдвинул
    // бы страницу под ним, и его нужно вернуть на то же место: импорт, который
    // кончился позже, никуда читателя не уводит.
    const late = () => {
      if (api) return;
      const above = section.getBoundingClientRect().bottom <= 0;
      const ref = above && plan.find((e) => e.section.getBoundingClientRect().bottom > 0);
      const was = ref ? ref.section.getBoundingClientRect().top : 0;
      entry.build();
      if (want !== null) { const i = want; want = null; entry.setState(i); }
      if (wantOpen) { wantOpen = false; entry.open(); }
      if (ref) {
        const moved = ref.section.getBoundingClientRect().top - was;
        if (Math.abs(moved) > 0.5) window.scrollBy(0, moved);
      }
    };
    return entry;
  });

  // Один запрос и одна загрузка на модуль, сколько бы раз о нем ни спросили.
  // Сорвавшаяся загрузка забывается — следующая просьба начнет ее заново.
  // Раздел, загруженный вместе со страницей, отвечает сразу.
  // Устаревшая вкладка. Адреса файлов от публикации к публикации те же, и
  // вкладка, открытая до новой, могла еще не скачать главу, вынесенную из
  // начальной загрузки: новый viz/space.js встречает тогда старые lib/, уже
  // загруженные страницей, и просит у них то, чего в них нет. Это ошибка
  // связывания (SyntaxError), а не сети, и браузер запоминает ее за адресом:
  // повтор через три секунды получал бы ее снова, и глава не собралась бы
  // никогда. Поэтому страница освежает в кэше браузера все скрипты и стили,
  // которые успела загрузить, и перечитывается с того же места
  // (story.reread). Не чаще раза в минуту: свежая копия, упавшая так же, — это
  // уже не устаревшая вкладка, и перезагрузка по кругу ничего бы не дала.
  const STALE = 'нсб-обновлена';
  function stale(err) {
    if (!(err instanceof SyntaxError)) return false;
    // Каркас объявлен ниже: до его сборки перечитывать нечем.
    let again;
    try { again = story && story.reread; } catch (e) { return false; }
    if (!again) return false;
    try {
      const was = Number(sessionStorage.getItem(STALE)) || 0;
      if (Date.now() - was < 60000) return false;
      sessionStorage.setItem(STALE, String(Date.now()));
    } catch (e) { return false; }
    const ours = performance.getEntriesByType('resource')
      .map((r) => r.name)
      .filter((u) => u.startsWith(location.origin) && /\.(js|css)$/.test(u.split(/[?#]/)[0]));
    Promise.all(ours.map((u) => fetch(u, { cache: 'reload' }).catch(() => null)))
      .then(() => again());
    return true;
  }

  function codeOf(mod) {
    if (mod.init) return Promise.resolve(mod);
    if (!mod.loading) {
      mod.loading = mod.load().then(
        (m) => { mod.init = m.init; return mod; },
        (err) => { mod.loading = null; throw err; }
      );
    }
    return mod.loading;
  }

  // Все остальное — шапка, подвал, полоска разделов — и то, что блоки
  // допишут на ходу: подсказки, ответы, карточки.
  keepBound(document.body);

  const progress = mountProgress(
    MODULES.map((mod) => mod.meta.title),
    // A name short enough to stand in the strip at the top of a phone, where
    // the whole heading would not fit — see meta.short in CLAUDE.md.
    MODULES.map((mod) => mod.meta.short || '')
  );
  mountTitleMark();
  const story = mountStepper(plan, {
    onProgress: progress.set,
    // One last beat after the story: the page lifts to show the credits.
    finale: document.querySelector('.page-footer'),
    // «Смотреть сначала» у нижнего края — для главы, в которую читатель
    // вернулся и увидел сразу ее итог.
    replay: document.querySelector('.page-replay')
  });
  // The progress bar doubles as the way back: a click on a block goes there,
  // and the narrow slot at its head returns to the title screen.
  // Прыжок по полоске: код раздела, куда идут, и всех до него (их прыжок
  // собирает по дороге) начинает грузиться сразу, а не когда до них дойдет.
  const jump = (i, ...rest) => {
    plan.slice(0, i + 1).forEach((e) => e.fetch());
    return story.toBlock(i, ...rest);
  };
  progress.pick(story.toBlock ? jump : story.toBlock, story.rewind);

  // Ссылки внутри разделов, ведущие в другой раздел (`data-go="space"`), —
  // тот же ход, что и выбор в полоске сверху: toBlock каркаса. Поэтому
  // полоска, место читателя и шаг назад после такого перехода те же, что и
  // после полоски. Адрес у ссылки настоящий (#space) — на случай, если
  // скрипт не дошел, — но по нему страница не прыгает: прыжок мимо машины
  // чтения оставил бы ее думать, что читатель все еще наверху. Фокус уходит
  // на заголовок раздела, куда пришли, — экран при этом не трогается.
  document.addEventListener('click', (e) => {
    const link = e.target.closest && e.target.closest('a[data-go]');
    if (!link || !story.toBlock) return;
    const i = MODULES.findIndex((m) => m.meta.id === link.dataset.go);
    if (i < 0) return;
    e.preventDefault();
    jump(i);
    const head = plan[i].section.querySelector('.viz-header h2');
    if (head) {
      head.tabIndex = -1;
      head.focus({ preventScroll: true });
    }
  });

  // Кнопка на обложке. Делает ровно то же, что первое движение колеса или
  // пальца: отдает странице один ход от титульного экрана. Поэтому раздел
  // начинается с начала — сперва переходный экран и объяснение, и только
  // потом вагоны, — и второй дороги в историю на странице не заводится.
  // Прыжок по разделу (toBlock) для этого не годится: он приводит к телу
  // блока, через голову его вступления.
  //
  // Просит она об этом тем же событием, которым блок со своей угадайкой
  // просит страницу идти дальше, — `story:next`. Его слушают обе машины
  // чтения, каждая своим ходом: широкая играет такт, узкая везет страницу до
  // ближайшей остановки. Второй дороги в историю на странице не заводится.
  //
  // Прыжок по разделу (toBlock) для этого не годится. На широком экране он
  // приводит к телу блока, через голову вступления, а на узком целится в
  // раздел, который в этот момент еще собирается и растет под прицелом: ход
  // доезжает и целится заново, и один экран пути занимал почти пять секунд.
  //
  // Второе нажатие подряд страницу дальше не уводит: ход уже идет, и нажали
  // на него, а не на следующий.
  const start = document.querySelector('[data-el="coverStart"]');
  if (start) {
    // Не ноль: performance.now() считается от открытия страницы, и с нулем
    // проверка «второе нажатие подряд» глотала все нажатия первых 1,2 секунды
    // — на быстрой сети и с теплым кэшем кнопка готова уже на 0,15 секунды, а
    // уводила со страницы только с 1,3.
    let went = -Infinity;
    start.addEventListener('click', () => {
      const now = performance.now();
      if (now - went < 1200) return;
      // «Дальше» считается от того места, где читатель стоит, а кнопка знает
      // только одно место — обложку. Нажатая откуда-то еще (клавишей, когда
      // шапка уже уехала), она шагнула бы вперед из середины истории.
      const head = document.querySelector('.page-header').getBoundingClientRect();
      if (head.bottom < window.innerHeight * 0.5) return;
      went = now;
      if (story.toBlock) { document.dispatchEvent(new CustomEvent('story:next')); return; }
      // При «меньше движения» на широком экране машины чтения нет вовсе:
      // страница собрана целиком и листается как обычная, и просьбу идти
      // дальше слушать некому. Везем сами — и сразу, без дороги: читатель
      // просил меньше движения, а не другую дорогу.
      const first = page.querySelector('.viz-section');
      if (first) window.scrollTo(0, first.offsetTop);
    });
  }

  // Что делать дочитавшему. «Сначала» ведет тем же путем, что и узкий слот в
  // начале полоски, — одна дорога назад на всю страницу.
  const again = document.querySelector('[data-el="again"]');
  if (again) again.addEventListener('click', () => story.rewind());

  // Пока финал складывает единицу, кнопки подвала ждут (`story:turning` из
  // viz/each.js): «Прочитать сначала» не должно прийти раньше, чем «Это ты».
  // Ждут только кнопки — страница листается как листалась. И не дольше
  // шести секунд: поворот, оборванный ошибкой, не оставит подвал без них.
  const endRow = document.querySelector('.page-end');
  let endCap = 0;
  const endWait = (on) => {
    if (!endRow) return;
    clearTimeout(endCap);
    endRow.classList.toggle('is-waiting', on);
    endRow.inert = on;
    if (on) endCap = setTimeout(() => endWait(false), 6000);
  };
  document.addEventListener('story:turning', (e) => endWait(!!(e.detail && e.detail.on)));

  // «Поделиться» показывается только там, где ему есть чем поделиться:
  // у автономной копии адрес вида file:// , и слать его некому.
  //
  // Делимся адресом страницы из <link rel="canonical">, а не тем, что в
  // строке адреса: там бывает ?debug, якорь раздела или адрес стенда, и
  // превью у такой ссылки чужое или никакое.
  //
  // Сначала — системное окно «Поделиться» (телефоны, Safari, Chrome на
  // Windows). Отмена в нем — это ответ читателя, а не поломка: молчим. Окно,
  // которое не открылось по другой причине, и браузер без такого окна —
  // копируем ссылку. «Ссылка скопирована» говорим только когда она правда
  // в буфере.
  const share = document.querySelector('[data-el="share"]');
  const said = document.querySelector('[data-el="shareSaid"]');
  const canonical = document.querySelector('link[rel="canonical"]');
  const link = canonical ? canonical.href : location.origin + location.pathname;
  const what = { title: document.title, url: link };
  const sheet = !!navigator.share
    && (!navigator.canShare || navigator.canShare(what));
  const canCopy = !!(navigator.clipboard && navigator.clipboard.writeText)
    || !!(document.queryCommandSupported && document.queryCommandSupported('copy'));

  // Буфер обмена: обычный способ, а где его нет или он отказал (старый
  // Safari, страница без https) — старый, через выделенное поле.
  const copy = async (text) => {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (err) { /* пробуем по-старому */ }
    const field = document.createElement('textarea');
    field.value = text;
    field.setAttribute('readonly', '');
    field.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
    document.body.appendChild(field);
    field.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    field.remove();
    share.focus({ preventScroll: true });
    return ok;
  };

  if (share && location.protocol !== 'file:' && (sheet || canCopy)) {
    share.hidden = false;
    const label = share.textContent;
    let busy = false;
    let back = 0;
    const tell = (text) => {
      clearTimeout(back);
      share.textContent = text;
      if (said) said.textContent = text;
      back = setTimeout(() => {
        share.textContent = label;
        if (said) said.textContent = '';
      }, 2000);
    };
    share.addEventListener('click', async () => {
      // Второе нажатие, пока окно открыто, браузер считает ошибкой.
      if (busy) return;
      busy = true;
      try {
        if (sheet) {
          try {
            await navigator.share(what);
            return;
          } catch (err) {
            if (err && err.name === 'AbortError') return;   // передумал
            // Окно не открылось — значит, копируем.
          }
        }
        if (canCopy && await copy(link)) tell('Ссылка скопирована');
      } finally {
        busy = false;
      }
    });
  }

  // Когда первый экран готов и страница отдышалась, код вынесенных глав
  // догружается в фоне — только код, без сборки: так прыжок по полоске в
  // дальнюю главу и быстрое чтение не застают ее пустой. До этого момента
  // ничего лишнего не грузится — сеть отдана обложке.
  const calm = (fn) => (window.requestIdleCallback
    ? requestIdleCallback(fn, { timeout: 4000 })
    : setTimeout(fn, 1500));
  const prefetch = () => calm(() => plan.forEach((e) => e.fetch()));
  if (document.readyState === 'complete') prefetch();
  else window.addEventListener('load', prefetch, { once: true });

  // Dev-only: numbers on screen for walking the page on a real phone.
  if (location.search.includes('debug')) import('./tools/debug-hud.js').catch(() => {});

</script>
</body>
</html>
